<!-- Language Selector Widget -->
<div class="language-selector-widget" ng-click-outside="dm.closeLanguageMenu()">
  <button class="language-toggle-btn" ng-click="dm.toggleLanguageMenu()" title="Change Language">
    <i class="fas fa-globe"></i>
    <span class="current-language">{{ dm.getCurrentLanguageLabel() }}</span>
    <i class="fas fa-chevron-down"></i>
  </button>

  <div class="language-dropdown" ng-show="dm.showLanguageMenu">
    <div class="language-menu">
      <h4 class="language-menu-title">{{ 'header.language' | translate }}</h4>
      
      <button 
        class="language-option" 
        ng-repeat="lang in dm.availableLanguages"
        ng-class="{active: dm.currentLanguage === lang.code}"
        ng-click="dm.switchLanguage(lang.code)"
        title="{{ lang.name }}">
        <span class="lang-flag">{{ lang.flag }}</span>
        <span class="lang-name">{{ lang.name }}</span>
        <i class="fas fa-check" ng-show="dm.currentLanguage === lang.code"></i>
      </button>
    </div>
  </div>
</div>
