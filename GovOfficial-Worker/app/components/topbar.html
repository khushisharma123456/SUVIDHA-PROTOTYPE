<!-- 
    Reusable Topbar Component for Field Agent Pages
    Used across: Search, Dashboard, Report, Settings
    Features: Language selection, notifications, sync, branding
-->

<header class="worker-header">
    <div class="header-left">
        <h2>{{pageTitle}}</h2>
        <p>{{pageSubtitle}}</p>
    </div>

    <div class="header-right">
        <!-- Language Selector -->
        <div class="lang-dropdown" style="position: relative;">
            <button class="topbar-btn lang-toggle-btn" 
                    ng-click="toggleLangMenu($event)"
                    aria-label="Select language"
                    aria-expanded="{{showLangMenu}}">
                <span class="lang-icon">🌐</span>
                <span class="lang-code">{{selectedLang}}</span>
                <span style="font-size: 0.6rem; margin-left: 0.15rem; transition: transform 0.2s;" 
                      ng-style="{'transform': showLangMenu ? 'rotate(180deg)' : 'rotate(0deg)'}">▼</span>
            </button>

            <!-- Language Menu -->
            <div class="lang-menu" ng-show="showLangMenu" ng-click="$event.stopPropagation()">
                <div class="menu-header">
                    <span>Select Language</span>
                </div>
                <div style="max-height: 320px; overflow-y: auto;">
                    <button class="menu-item" 
                            ng-repeat="lang in languages"
                            ng-class="{active: selectedLang === lang.code}"
                            ng-click="selectLang(lang)">
                        <span style="margin-right: 0.5rem;" ng-if="selectedLang === lang.code">✓</span>
                        {{lang.name}}
                    </button>
                </div>
            </div>
        </div>

        <!-- Notifications -->
        <div class="notification-wrapper" style="position: relative;">
            <button class="topbar-btn notification-btn" 
                    ng-click="toggleNotifications($event)"
                    title="Notifications"
                    aria-label="Show notifications">
                <span class="notification-icon">🔔</span>
                <span class="notification-badge" ng-if="notificationsCount > 0">{{notificationsCount}}</span>
            </button>

            <!-- Notifications Menu -->
            <div class="notification-menu" ng-show="showNotifications" ng-click="$event.stopPropagation()" style="min-width: 320px;">
                <div class="menu-header">
                    <span>Government Messages</span>
                    <button ng-click="showNotifications = false" style="background: none; border: none; cursor: pointer; color: #94a3b8;">✕</button>
                </div>
                <div style="max-height: 400px; overflow-y: auto;">
                    <div ng-repeat="msg in govMessages" 
                         ng-click="markAsRead(msg)" 
                         class="menu-item"
                         style="padding: 1.25rem; border-bottom: 1px solid #f8fafc;"
                         ng-style="{'background': msg.unread ? 'rgba(37, 99, 235, 0.05)' : 'white'}">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 0.35rem;">
                            <span style="font-weight: 800; font-size: 0.75rem; color: var(--gov-primary); text-transform: uppercase;">{{msg.sender}}</span>
                            <span style="font-size: 0.65rem; font-weight: 700; color: #94a3b8;">{{msg.time}}</span>
                        </div>
                        <div style="font-size: 0.85rem; color: #475569; line-height: 1.5; font-weight: 500;">{{msg.text}}</div>
                    </div>
                    <div ng-if="govMessages.length === 0" style="padding: 3rem 1.5rem; text-align: center; color: #94a3b8; font-size: 0.9rem;">
                        No new messages
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>

<!-- Styles specific to Topbar Component -->
<style>
    .worker-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 2rem;
        background: #FFFFFF;
        border-bottom: 1px solid #E5E7EB;
        box-shadow: none;
        position: sticky;
        top: 0;
        z-index: 100;
        height: 64px;
    }

    .header-left {
        flex: 1;
    }

    .header-left h2 {
        font-size: 1.25rem;
        font-weight: 700;
        margin: 0;
        color: #111827;
    }

    .header-left p {
        font-size: 0.8rem;
        color: #6B7280;
        margin: 2px 0 0;
        font-weight: 400;
    }

    .header-right {
        display: flex;
        align-items: center;
        gap: 0.75rem;
    }

    /* Topbar Button Styles */
    .topbar-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 0.5rem 0.9rem;
        background: #F3F4F6;
        border: 1px solid #E5E7EB;
        border-radius: 8px;
        color: #374151;
        font-size: 0.9rem;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    .topbar-btn:hover {
        background: #E5E7EB;
        border-color: #D1D5DB;
        transform: translateY(-1px);
    }

    .topbar-btn:active {
        transform: translateY(0);
    }

    /* Sync Button */
    .sync-btn {
        font-size: 1.2rem;
        padding: 0.6rem;
    }

    .sync-btn:active {
        animation: spin 0.5s ease-in-out;
    }

    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    /* Language Dropdown */
    .topbar-menu-wrapper {
        position: relative;
    }

    .lang-toggle-btn {
        display: flex;
        align-items: center;
        gap: 0.4rem;
    }

    .lang-icon {
        font-size: 1.1rem;
    }

    .lang-code {
        font-weight: 600;
        font-size: 0.9rem;
    }

    .dropdown-arrow {
        font-size: 0.7rem;
        transition: transform 0.2s ease;
        margin-left: 0.25rem;
    }

    .dropdown-arrow.active {
        transform: rotate(180deg);
    }

    /* Dropdown Menu Base */
    .topbar-dropdown-menu {
        position: absolute;
        top: calc(100% + 0.5rem);
        right: 0;
        background: white;
        border: 1px solid var(--gov-gray-200);
        border-radius: 12px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
        min-width: 220px;
        max-height: 400px;
        overflow-y: auto;
        z-index: 1001;
        animation: slideIn 0.2s ease;
    }

    @keyframes slideIn {
        from {
            opacity: 0;
            transform: translateY(-10px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .dropdown-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1rem;
        border-bottom: 1px solid var(--gov-gray-100);
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--gov-gray-700);
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .close-btn {
        background: none;
        border: none;
        color: var(--gov-gray-500);
        font-size: 1rem;
        cursor: pointer;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: color 0.2s ease;
    }

    .close-btn:hover {
        color: var(--gov-gray-700);
    }

    .dropdown-content {
        display: flex;
        flex-direction: column;
    }

    /* Language Option */
    .lang-option {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.85rem 1rem;
        background: transparent;
        border: none;
        color: var(--gov-gray-700);
        cursor: pointer;
        transition: all 0.15s ease;
        text-align: left;
        font-size: 0.95rem;
        font-weight: 500;
        border-bottom: 1px solid var(--gov-gray-50);
    }

    .lang-option:last-child {
        border-bottom: none;
    }

    .lang-option:hover {
        background: var(--gov-gray-50);
    }

    .lang-option.active {
        background: var(--gov-info-light);
        color: var(--gov-info);
        font-weight: 600;
    }

    .checkmark {
        font-weight: 700;
        color: var(--gov-success);
    }

    .lang-name {
        flex: 1;
    }

    /* Notification Badge */
    .notification-btn {
        position: relative;
    }

    .notification-icon {
        font-size: 1.2rem;
    }

    .notification-badge {
        position: absolute;
        top: -6px;
        right: -6px;
        background: var(--gov-danger);
        color: white;
        font-size: 0.65rem;
        font-weight: 700;
        min-width: 20px;
        height: 20px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px solid #FFFFFF;
        animation: pulse 2s infinite;
    }

    @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.7; }
    }

    /* Notification Menu Styles */
    .notification-menu {
        min-width: 300px;
        max-height: 480px;
    }

    .msg-list {
        padding: 0.5rem 0;
    }

    .msg-item {
        padding: 1rem;
        border-bottom: 1px solid var(--gov-gray-100);
        cursor: pointer;
        transition: background 0.2s;
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
    }

    .msg-item:last-child {
        border-bottom: none;
    }

    .msg-item:hover {
        background: var(--gov-gray-50);
    }

    .msg-item.unread {
        background: var(--gov-info-light);
    }

    .msg-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 0.2rem;
    }

    .sender {
        font-weight: 700;
        font-size: 0.9rem;
        color: var(--gov-primary);
    }

    .time {
        font-size: 0.75rem;
        color: var(--gov-gray-500);
    }

    .msg-body {
        font-size: 0.85rem;
        color: var(--gov-gray-700);
        line-height: 1.4;
    }

    /* User Avatar */
    .user-avatar-btn {
        padding: 0.5rem 0.75rem;
        min-width: 40px;
        min-height: 40px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.25);
        font-weight: 700;
    }

    /* Responsive */
    @media (max-width: 768px) {
        .worker-header {
            flex-wrap: wrap;
            padding: 1rem;
        }

        .header-left {
            width: 100%;
            margin-bottom: 1rem;
        }

        .header-left h2 {
            font-size: 1.25rem;
        }

        .header-left p {
            font-size: 0.8rem;
        }

        .header-right {
            width: 100%;
            justify-content: flex-end;
        }

        .topbar-button-text {
            display: none;
        }

        .topbar-dropdown-menu {
            right: auto;
            left: 0;
        }
    }
</style>
