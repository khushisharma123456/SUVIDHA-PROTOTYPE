<!-- Unified Sidebar Component for Suvidha Field Agent -->
<aside class="worker-sidebar" ng-controller="SidebarController">
    <div class="sidebar-header">
        <a href="dashboard.html" class="sidebar-brand" style="text-decoration: none; display: flex; align-items: center; gap: 0.75rem; cursor: pointer;">
            <div class="brand-logo">
                <img src="/static/images/suvidha Logo.jpg" alt="Suvidha Logo" style="width: 40px; height: 40px; border-radius: 8px; object-fit: cover;">
            </div>
            <div class="brand-text">
                <h1 style="margin: 0; font-size: 1.1rem;">Suvidha</h1>
                <span class="brand-subtitle" style="font-size: 0.7rem; display: block;">FIELD AGENT</span>
            </div>
        </a>
    </div>

    <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item" ng-class="{active: isCurrentPage('dashboard')}">
            <span class="nav-icon-wrapper">📊</span>
            <span class="nav-text">Dashboard</span>
        </a>
        <a href="wallet.html" class="nav-item" ng-class="{active: isCurrentPage('wallet')}">
            <span class="nav-icon-wrapper">💰</span>
            <span class="nav-text">My Wallet</span>
        </a>
        <a href="search.html" class="nav-item" ng-class="{active: isCurrentPage('search')}">
            <span class="nav-icon-wrapper">🏠</span>
            <span class="nav-text">Households</span>
        </a>
        <a href="report.html" class="nav-item" ng-class="{active: isCurrentPage('report')}">
            <span class="nav-icon-wrapper">⚠️</span>
            <span class="nav-text">Report Issue</span>
        </a>
        <a href="settings.html" class="nav-item" ng-class="{active: isCurrentPage('settings')}">
            <span class="nav-icon-wrapper">⚙️</span>
            <span class="nav-text">Settings</span>
        </a>
    </nav>

    <div class="sidebar-footer">
        <div class="user-profile">
            <div class="user-avatar">{{user.initials || 'VS'}}</div>
            <div class="user-info">
                <h4>{{user.name || 'Vikram Singh'}}</h4>
                <p>{{user.role || 'Electric Meter Reader'}}</p>
            </div>
        </div>

        <button class="logout-btn" ng-click="logout()">
            <span>🚪</span>
            <span>Logout</span>
        </button>
    </div>
</aside>
