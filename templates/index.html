<!DOCTYPE html>
<html lang="en" ng-app="suvidhaApp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suvidha - Citizen Portal</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular-route.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular-sanitize.min.js"></script>

    <style>
        /* Dialog overlay */
        .suvidha-dialog-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.45);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: dialogFadeIn 0.2s ease;
            backdrop-filter: blur(4px);
        }
        .suvidha-dialog {
            background: #fff;
            border-radius: 16px;
            padding: 1.75rem 2rem;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 24px 80px rgba(0,0,0,0.18), 0 8px 24px rgba(0,0,0,0.1);
            text-align: center;
            animation: dialogSlideUp 0.25s ease;
            position: relative;
        }
        .suvidha-dialog-close {
            position: absolute;
            top: 0.75rem;
            right: 0.75rem;
            background: #f3f4f6;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.1rem;
            color: #6b7280;
            transition: all 0.15s;
            line-height: 1;
        }
        .suvidha-dialog-close:hover {
            background: #e5e7eb;
            color: #374151;
        }
        .suvidha-dialog-icon {
            width: 52px; height: 52px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 0.875rem;
            font-size: 1.25rem;
        }
        .suvidha-dialog-icon.info { background: #EBF5FF; color: #1D70B8; }
        .suvidha-dialog-icon.success { background: #ECFDF5; color: #00703C; }
        .suvidha-dialog-icon.warning { background: #FFF7ED; color: #F47738; }
        .suvidha-dialog-icon.error { background: #FEF2F2; color: #EF4444; }
        .suvidha-dialog h3 {
            font-size: 1.0625rem;
            font-weight: 600;
            color: #111827;
            margin: 0 0 0.375rem;
        }
        .suvidha-dialog p {
            font-size: 0.85rem;
            color: #6B7280;
            margin: 0 0 1.25rem;
            line-height: 1.5;
        }
        .suvidha-dialog-actions {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
        }
        .suvidha-dialog-btn {
            display: inline-block;
            padding: 0.5rem 1.5rem;
            background: #1D70B8;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s;
        }
        .suvidha-dialog-btn:hover { background: #0055A4; }
        .suvidha-dialog-btn.secondary {
            background: #F3F4F6;
            color: #374151;
        }
        .suvidha-dialog-btn.secondary:hover { background: #E5E7EB; }
        @keyframes dialogFadeIn { from { opacity:0; } to { opacity:1; } }
        @keyframes dialogSlideUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }

        /* Mobile sidebar toggle */
        .mobile-header {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 56px;
            background: #FFFFFF;
            border-bottom: 1px solid #e5e7eb;
            z-index: 999;
            align-items: center;
            padding: 0 1rem;
            gap: 0.75rem;
        }
        .mobile-header img { height: 28px; }
        .mobile-header span { color: #111827; font-weight: 600; font-size: 1.1rem; }
        .mobile-menu-btn {
            background: none; border: none; color: #374151;
            font-size: 1.5rem; cursor: pointer; margin-left: auto;
        }
        @media (max-width: 768px) {
            .mobile-header { display: flex; }
            .sidebar { transform: translateX(-100%); }
            .sidebar.mobile-open { transform: translateX(0); }
            .main-wrapper { margin-left: 0 !important; padding-top: 56px; }
        }
    </style>
</head>
<body>
    <!-- Mobile Header -->
    <div class="mobile-header">
        <img src="/static/images/suvidha%20Logo.jpg" alt="Suvidha">
        <span>Suvidha</span>
        <button class="mobile-menu-btn" ng-click="toggleMobileSidebar()">&#9776;</button>
    </div>

    <!-- Sidebar -->
    <aside class="sidebar" ng-class="{'collapsed': sidebarCollapsed, 'mobile-open': mobileMenuOpen}" ng-click="$event.stopPropagation()">
        <!-- Header with Logo -->
        <div class="sidebar-header">
            <a href="#!/dashboard" class="sidebar-logo">
                <img src="/static/images/suvidha%20Logo.jpg" alt="Suvidha" class="sidebar-emblem" style="border-radius:6px;">
                <span class="sidebar-title">Suvidha</span>
            </a>
            <button class="sidebar-toggle" ng-click="toggleSidebar()">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
        </div>

        <!-- Notice -->
        <div class="sidebar-notice" ng-hide="sidebarCollapsed">
            <svg class="notice-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <span class="notice-text">All data sourced from official government records</span>
        </div>

        <!-- Navigation -->
        <nav class="sidebar-nav">
            <a href="#!/dashboard" class="sidebar-link" ng-class="{'active': currentPage === 'dashboard' || currentPage === ''}">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                <span class="sidebar-link-text">Dashboard</span>
            </a>
            <a href="#!/utilities" class="sidebar-link" ng-class="{'active': currentPage === 'utilities'}">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path></svg>
                <span class="sidebar-link-text">Utilities</span>
            </a>
            <a href="#!/services" class="sidebar-link" ng-class="{'active': currentPage === 'services'}">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg>
                <span class="sidebar-link-text">Services</span>
            </a>
            <a href="#!/waste-management" class="sidebar-link" ng-class="{'active': currentPage === 'waste-management'}">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                <span class="sidebar-link-text">Waste Management</span>
            </a>
            <a href="#!/community" class="sidebar-link" ng-class="{'active': currentPage === 'community'}">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                <span class="sidebar-link-text">Community</span>
            </a>
            <a href="#!/records" class="sidebar-link" ng-class="{'active': currentPage === 'records'}">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
                <span class="sidebar-link-text">Records</span>
            </a>
            <a href="#!/insights" class="sidebar-link" ng-class="{'active': currentPage === 'insights'}">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
                <span class="sidebar-link-text">Insights</span>
            </a>
            <a href="#!/simulator" class="sidebar-link" ng-class="{'active': currentPage === 'simulator'}">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect><rect x="9" y="9" width="6" height="6"></rect><line x1="9" y1="1" x2="9" y2="4"></line><line x1="15" y1="1" x2="15" y2="4"></line><line x1="9" y1="20" x2="9" y2="23"></line><line x1="15" y1="20" x2="15" y2="23"></line><line x1="20" y1="9" x2="23" y2="9"></line><line x1="20" y1="14" x2="23" y2="14"></line><line x1="1" y1="9" x2="4" y2="9"></line><line x1="1" y1="14" x2="4" y2="14"></line></svg>
                <span class="sidebar-link-text">Simulator</span>
            </a>
            <a href="#!/profile" class="sidebar-link" ng-class="{'active': currentPage === 'profile'}">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                <span class="sidebar-link-text">Profile</span>
            </a>
        </nav>

        <!-- Footer -->
        <div class="sidebar-footer">
            <div class="sidebar-user">
                <div class="user-avatar">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                </div>
                <div class="user-info">
                    <span class="user-name">{{userName}}</span>
                    <span class="user-role">Citizen</span>
                </div>
            </div>
            <button class="sidebar-logout" ng-click="logout()">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                <span class="sidebar-link-text">Logout</span>
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-wrapper" ng-class="{'collapsed': sidebarCollapsed}" ng-click="closeMobileSidebar()">
        <div ng-view></div>
    </main>

    <!-- Global Dialog Component -->
    <div class="suvidha-dialog-overlay" ng-if="dialog.show" ng-click="dialog.show = false">
        <div class="suvidha-dialog" ng-click="$event.stopPropagation()">
            <button class="suvidha-dialog-close" ng-click="dialog.show = false" title="Close">&times;</button>
            <div class="suvidha-dialog-icon" ng-class="dialog.type || 'info'">
                <span ng-bind-html="dialog.icon"></span>
            </div>
            <h3>{{dialog.title}}</h3>
            <p>{{dialog.message}}</p>
            <div class="suvidha-dialog-actions">
                <button class="suvidha-dialog-btn" ng-click="dialog.show = false">{{dialog.btnText || 'OK'}}</button>
                <button class="suvidha-dialog-btn secondary" ng-if="dialog.showCancel" ng-click="dialog.show = false">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        // Initialize authentication token from Flask session
        // This ensures AngularJS app knows user is authenticated
        if (!localStorage.getItem('authToken')) {
            // Set a dummy token since Flask backend handles auth via sessions
            localStorage.setItem('authToken', 'flask-session-auth');
        }
    </script>
    <script src="/static/app/app.js"></script>
    <script src="/static/app/services/auth.service.js"></script>
    <script src="/static/app/services/api.service.js"></script>
    <script src="/static/app/services/translation.service.js"></script>
    <script src="/static/app/controllers/auth.controller.js"></script>
    <script src="/static/app/controllers/dashboard.controller.js"></script>
    <script src="/static/app/controllers/utilities.controller.js"></script>
    <script src="/static/app/controllers/services.controller.js"></script>
    <script src="/static/app/controllers/waste.controller.js"></script>
    <script src="/static/app/controllers/community.controller.js"></script>
    <script src="/static/app/controllers/records.controller.js"></script>
    <script src="/static/app/controllers/insights.controller.js"></script>
    <script src="/static/app/controllers/simulator.controller.js"></script>
    <script src="/static/app/controllers/profile.controller.js"></script>
</body>
</html>
