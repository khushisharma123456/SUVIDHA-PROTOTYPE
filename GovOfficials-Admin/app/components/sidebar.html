<!-- Government Dashboard Sidebar Component -->
<aside class="gov-sidebar" id="govSidebar">
    <!-- Sidebar Header -->
    <div class="sidebar-header">
        <div class="sidebar-brand">
            <div class="brand-icon">
                <img src="/static/images/emblem.png" alt="Emblem"
                    onerror="this.style.display='none'; this.parentNode.innerHTML='🏛️'">
            </div>
            <div class="brand-text">
                <h1>Suvidha</h1>
                <span>CITY CONTROL ROOM</span>
            </div>
        </div>
    </div>

    <!-- Navigation Menu -->
    <nav class="sidebar-nav">
        <a href="#!/" class="nav-item" ng-class="{active: isActive('/')}">
            <span class="nav-icon">🏠</span>
            <span class="nav-text">Dashboard</span>
        </a>
        <a href="#!/grievance" class="nav-item" ng-class="{active: isActive('/grievance')}">
            <span class="nav-icon">📢</span>
            <span class="nav-text">Grievance Command</span>
        </a>
        <a href="#!/meter" class="nav-item" ng-class="{active: isActive('/meter')}">
            <span class="nav-icon">⚡</span>
            <span class="nav-text">Meter Integrity</span>
        </a>
        <a href="#!/field-operations" class="nav-item" ng-class="{active: isActive('/field-operations')}">
            <span class="nav-icon">👷</span>
            <span class="nav-text">Field Operations</span>
        </a>
        <a href="#!/rwa" class="nav-item" ng-class="{active: isActive('/rwa')}">
            <span class="nav-icon">🏗️</span>
            <span class="nav-text">RWA Oversight</span>
        </a>
        <a href="#!/participation" class="nav-item" ng-class="{active: isActive('/participation')}">
            <span class="nav-icon">⭐</span>
            <span class="nav-text">Participation & Incentives</span>
        </a>
        <a href="#!/policy" class="nav-item" ng-class="{active: isActive('/policy')}">
            <span class="nav-icon">📊</span>
            <span class="nav-text">Policy Insights</span>
        </a>
        <a href="#!/audit" class="nav-item" ng-class="{active: isActive('/audit')}">
            <span class="nav-icon">🔐</span>
            <span class="nav-text">Audit Vault</span>
        </a>
    </nav>

    <!-- Sidebar Footer - User Profile -->
    <div class="sidebar-footer">
        <div class="user-profile">
            <div class="user-avatar">{{user.initials}}</div>
            <div class="user-info">
                <h4>{{user.name}}</h4>
                <p>{{user.role}}</p>
                <small>Last Login: {{user.lastLogin}}</small>
            </div>
        </div>
        <button class="logout-btn" ng-click="logout()">
            <span>🚪</span>
            <span>Logout</span>
        </button>
    </div>
</aside>
